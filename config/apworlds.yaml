  oot: {game: "Ocarina of Time", source: core, needs_yaml: true}
  # M14: core games of the room played by others (validated 3/3 with random options + e2e batch m14). Their worlds
  # cannot be rebuilt from slot_data alone: logic only for slots whose player's yaml is provided.
  witness: {game: "The Witness", source: core, logic: true, needs_yaml: true}
  ror2: {game: "Risk of Rain 2", source: core, logic: true, needs_yaml: true}
