# Source of each game's apworld. Editable by hand, then run:
#   .venv/bin/python scripts/fetch_apworlds.py            (downloads what is missing)
#   .venv/bin/python scripts/fetch_apworlds.py --update   (re-resolves "latest" tags)
# Resolved versions are written to config/apworlds.lock.yaml.
#
# Keys:
#   game              exact `game` name of the World (as seen in the datapackage)
#   source            core (ships with Archipelago 0.6.7) | github
#   repo              owner/name of the GitHub repository (source: github)
#   tag               "latest" (newest non-draft release) or a pinned tag
#   asset             glob matching the .apworld asset of the release
#   allow_prerelease  accept prereleases when tag is "latest" (default false)
#   filename          optional: name to save the asset as in custom_worlds/
#   commit            instead of tag/asset: the repository itself at this full commit sha (apworld used from a
#                     branch, not a release); `filename` is then required and names the module
#   logic             true = show "checks en logique" for this game (only once validated, see docs/COMPAT.md);
#                     false/absent = "Logique indisponible" (level 1 tracking only)
#   needs_yaml        true = the logic needs the player's yaml (the world cannot be rebuilt from slot_data alone);
#                     the Configuration page warns when such a slot has no yaml

apworlds:
  celeste_open_world: {game: "Celeste (Open World)", source: core, logic: true, needs_yaml: true}
  kh2: {game: "Kingdom Hearts 2", source: core, logic: true, needs_yaml: true}
  jakanddaxter: {game: "Jak and Daxter: The Precursor Legacy", source: core, logic: true, needs_yaml: true}
  sm64ex: {game: "Super Mario 64", source: core, logic: true, needs_yaml: true}
  oot: {game: "Ocarina of Time", source: core, needs_yaml: true}

  twwhd:
    game: "The Wind Waker HD"
    needs_yaml: true
    source: github
    repo: Teotia444/twwhd-apworld
    # The room was generated with main (Wii U + 1.1.0 support), not with release v1.0.2-beta (D12).
    commit: c21882644711807ee2e61a096280f5385186e5de
    filename: twwhd-apworld-main.apworld
    logic: true
